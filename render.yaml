services:
  - type: web
    name: freqtrade-bot
    runtime: image
    plan: free
    image:
      url: freqtradeorg/freqtrade:stable
    command: trade --config user_data/configs/config.json --strategy SecureFreqStrategy
    envVars:
      - key: FREQTRADE__EXCHANGE__NAME
        value: kraken
      - key: FREQTRADE__STAKE_AMOUNT
        value: "50"
      - key: FREQTRADE__DRY_RUN
        value: "true"
      - key: FREQTRADE__INITIAL_STATE
        value: "running"